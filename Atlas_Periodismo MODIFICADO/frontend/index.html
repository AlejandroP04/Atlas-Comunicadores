<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas de Comunicadores | FES Aragón </title>
    
    <link rel="icon" type="image/png" href="Imagenes/Logo_Institucion.png">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header border-bottom bg-white py-2 sticky-top shadow-sm">
        <div class="container-fluid d-flex align-items-center justify-content-between px-4">
            
            <div class="header-logo d-flex align-items-center">
                <img src="Imagenes/Logo_Institucion.png" alt="Logo FES Aragón" height="45" class="me-3">
                <span class="logo-text fw-bold text-uppercase" style="line-height: 1.2;">Atlas de Comunicadores <br> FES Aragon</span>
            </div>
            <div class="header-search flex-grow-1 mx-5 d-none d-md-block">
                <div class="search-wrapper">
                    <input type="text" id="input-busqueda" class="form-control" placeholder="Busca Perfiles, Categorías, Pais...">
                </div>
            </div>
            <nav class="header-nav d-flex gap-3">
                <a href="#" class="nav-link-custom">¿Quienes Somos?</a>
                <a href="#" class="nav-link-custom">Sobre Este Proyecto</a>
            </nav>
        </div>
    </header>

    <section class="hero-section bg-black text-white text-center py-5">
        <div class="container py-4">
            <h1 class="display-4 fw-bolder mb-3 tracking-tighter">ATLAS INSTITUCIONAL FES ARAGON</h1>
            <p class="hero-text lead mb-4 px-md-5">Base de de Datos de Creadores Independientes de Periodistas de Plataformas.</p>
            <button class="btn btn-neon px-5 py-2 fw-bold text-uppercase">Leer Más ↓</button>
        </div>
    </section>

    <div class="container-fluid bg-light py-4 px-4">
        <div class="row">
            
            <aside class="col-lg-3 col-md-4">
                <div class="filter-sidebar sticky-top" style="top: 100px;">
                    <h5 class="fw-bold mb-3">Filtros</h5>
                    <button id="btn-clear-all" class="btn btn-secondary w-100 mb-4 fw-bold" style="background-color: #99ACC4; color: #000; border: none;">✕ Eliminar todos los filtros</button>
                    <div id="filters-container" class="atlas-scroll">
                        </div>
                </div>
            </aside>

            <main class="col-lg-9 col-md-8">
                
                <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 border rounded shadow-sm">
                    <span class="text-muted small fw-bold" id="counter-text">Mostrando Creadores...</span>
                    <div class="btn-group btn-group-sm" id="view-controls">
                        <button class="btn btn-dark active" data-view="grid">Red</button>
                        <button class="btn btn-outline-dark" data-view="list">Lista</button>
                        <button class="btn btn-outline-dark" data-view="bubbles">Burbuja</button>
                        <button class="btn btn-outline-dark" data-view="wheel">Rueda</button>
                        <button class="btn btn-outline-dark" data-view="treemap">Mapa de Árbol</button>
                    </div>
                </div>

                <div id="lista-personas" class="row g-3">
                    </div>

            </main> 
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
